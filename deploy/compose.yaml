services:
  dathost-bridge:
    build:
      context: ..
      dockerfile: bridge/Dockerfile
    container_name: dathost-bridge
    restart: unless-stopped
    env_file:
      - ./env/dathost-bridge.env
    volumes:
      - ../runtime/dathost-bridge:/var/lib/dathost-bridge
    ports:
      - "127.0.0.1:18080:8080"

  mc-relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    container_name: mc-relay
    restart: unless-stopped
    env_file:
      - ./env/greggpt.env
      - ./env/dathost-bridge.env
    environment:
      - DATHOST_BRIDGE_URL=http://dathost-bridge:8080
      - GREGGPT_AUTH_FILE=/root/.greggpt/auth.json
      - GREGGPT_WORKSPACE=/root/.greggpt/workspace
      - MC_RELAY_STATE_FILE=/var/lib/mc-relay/state.json
    volumes:
      - ../runtime/mc-relay:/var/lib/mc-relay
      - ../runtime/greggpt:/root/.greggpt
      - ../workspace:/root/.greggpt/workspace
    depends_on:
      - dathost-bridge

  discord-commands:
    build:
      context: ..
      dockerfile: discord-commands/Dockerfile
    container_name: discord-commands
    restart: unless-stopped
    env_file:
      - ./env/greggpt.env
    environment:
      - GREGGPT_AUTH_FILE=/root/.greggpt/auth.json
      - GREGGPT_WORKSPACE=/root/.greggpt/workspace
      - DISCORD_WORKSPACE=/root/.greggpt/workspace
    volumes:
      - ../runtime/greggpt:/root/.greggpt
      - ../workspace:/root/.greggpt/workspace

  kanban-sync:
    build:
      context: ..
      dockerfile: kanban-sync/Dockerfile
    container_name: kanban-sync
    restart: unless-stopped
    env_file:
      - ./env/greggpt.env
    environment:
      - KANBAN_STATE_FILE=/var/lib/kanban-sync/state.json
      - KANBAN_IN_PROGRESS_STATE_FILE=/var/lib/kanban-sync/in-progress-state.json
      - KANBAN_WORKDIR=/root/.greggpt/workspace
    volumes:
      - ../runtime/kanban-sync:/var/lib/kanban-sync
      - ../workspace:/root/.greggpt/workspace

  inventory-sync:
    build:
      context: ..
      dockerfile: inventory-sync/Dockerfile
    container_name: inventory-sync
    restart: unless-stopped
    env_file:
      - ./env/greggpt.env
      - ./env/dathost-bridge.env
    environment:
      - INVENTORY_WORKDIR=/root/.greggpt/workspace
      - INVENTORY_STATE_FILE=/var/lib/inventory-sync/state.json
    volumes:
      - ../runtime/inventory-sync:/var/lib/inventory-sync
      - ../workspace:/root/.greggpt/workspace
